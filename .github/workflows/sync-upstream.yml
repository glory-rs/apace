name: Sync upstream mirror
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apace-upstream-mirror
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The built-in token cannot mirror changes to upstream workflow files.
      - name: Require upstream mirror credentials
        shell: bash
        env:
          UPSTREAM_SYNC_SSH_KEY: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}
        run: |
          if [ -z "$UPSTREAM_SYNC_SSH_KEY" ]; then
            echo "::error::Set UPSTREAM_SYNC_SSH_KEY to this repository's write deploy key; see docs/upstream-sync.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}
      - name: Update only upstream-main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/DioxusLabs/blitz.git refs/heads/main
          upstream=$(git rev-parse FETCH_HEAD)
          previous=$(git ls-remote origin refs/heads/upstream-main | cut -f1)
          if [ -n "$previous" ]; then
            git push --force-with-lease="refs/heads/upstream-main:$previous" origin "$upstream:refs/heads/upstream-main"
          else
            git push origin "$upstream:refs/heads/upstream-main"
          fi
