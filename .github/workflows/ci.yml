name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    name: validate-windows
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_HOME: D:/BuildCache/apace/cargo
      CARGO_TARGET_DIR: D:/BuildCache/apace/target
      RUSTUP_HOME: D:/BuildCache/apace/rustup
      TEMP: D:/BuildCache/apace/tmp
      TMP: D:/BuildCache/apace/tmp
      PYTHONPYCACHEPREFIX: D:/BuildCache/apace/pycache
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      # Boa's executable documentation needs more than the default Windows main-thread stack.
      RUSTDOCFLAGS: '-C link-arg=/STACK:8388608'
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Prepare compiler and storage
        run: |
          New-Item -ItemType Directory -Force $env:CARGO_HOME,$env:CARGO_TARGET_DIR,$env:RUSTUP_HOME,$env:TEMP | Out-Null
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE) { throw 'Toolchain installation failed' }
          rustup default 1.98.0
      - name: Validate source
        run: |
          python -m unittest discover -s scripts -p test_release.py
          if ($LASTEXITCODE) { throw 'Release tooling tests failed' }
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { throw 'Formatting failed' }
      # Reviewed upstream development dependencies may use Git revisions. Keep
      # the strict publication checks on release tags; release.py also enforces
      # them again before it can upload anything.
      - name: Validate release plan and archive
        if: startsWith(github.ref, 'refs/tags/apace-v')
        run: |
          python scripts/release.py
          if ($LASTEXITCODE) { throw 'Release plan failed' }
          python scripts/release.py --check-package apace-traits
          if ($LASTEXITCODE) { throw 'Archive contents failed' }
      - name: Tests and compilation
        run: |
          cargo test --locked -p apace-dom --no-default-features --features system-fonts,complex-scripts --lib
          if ($LASTEXITCODE) { throw 'Validation failed' }
          cargo test --locked -p apace-shell --no-default-features --lib
          if ($LASTEXITCODE) { throw 'Validation failed' }
          cargo test --locked -p apace-dom --no-default-features --features system-fonts,complex-scripts,parallel-construct,writing-mode --lib
          if ($LASTEXITCODE) { throw 'Validation failed' }
          cargo test --locked -p apace-paint --no-default-features --test top_layers --test indeterminate --test placeholders
          if ($LASTEXITCODE) { throw 'Validation failed' }
          cargo check --locked -p apace --all-targets
          if ($LASTEXITCODE) { throw 'Validation failed' }
          cargo test --locked --workspace
          if ($LASTEXITCODE) { throw 'Workspace regression failed' }
