[package]
name = "apace-vibey-script"
description = "JavaScript execution for Apace using the Boa engine"
documentation = "https://docs.rs/apace-vibey-script"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
tracing = ["dep:tracing", "apace-dom/tracing"]

[dependencies]
# Apace dependencies
apace-dom = { workspace = true, features = ["autofocus"] }
apace-html = { workspace = true }
apace-traits = { workspace = true }

# Boa (JavaScript engine)
# `annex-b` enables the Annex B (web-compatibility) ECMAScript features
# (String.prototype.substr, escape/unescape, HTML comments in scripts, ...)
# which all browsers implement and web content relies on
boa_engine = { workspace = true, features = ["annex-b"] }
boa_runtime = { workspace = true }
boa_gc = { workspace = true }

# Servo dependencies
markup5ever = { workspace = true }
style = { workspace = true }

# Other dependencies
icu_properties = { workspace = true }
keyboard-types = { workspace = true }
log = "0.4.34"
url = { workspace = true }
data-url = { workspace = true }
web-time = { workspace = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
apace-traits = { workspace = true }
# system-fonts is needed so that text inputs shape real text in tests
# (the selection tests depend on cursor placement within a text layout)
apace-dom = { workspace = true, features = ["system-fonts", "text-transform-icu"] }
keyboard-types = { workspace = true }
url = { workspace = true }
