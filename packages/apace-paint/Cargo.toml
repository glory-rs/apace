[package]
name = "apace-paint"
description = "Paint a Apace Document using anyrender"
documentation = "https://docs.rs/apace-paint"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["svg"]
tracing = ["dep:tracing"]
svg = ["dep:anyrender_svg", "dep:usvg", "apace-dom/svg"]
custom-widget = ["apace-dom/custom-widget"]
font-embolden = []
apple-font-embolden = []
# Paint overlay scrollbar thumbs on scroll containers, and enable their
# drag/hover interaction in apace-dom (off by default while the feature
# matures).
scrollbars = ["apace-dom/scrollbars"]

[dependencies]
# Apace dependencies
anyrender = { workspace = true }
anyrender_svg = { workspace = true, optional = true }
apace-traits = { workspace = true }
apace-dom = { workspace = true }

# Servo dependencies
style = { workspace = true }
euclid = { workspace = true }

# DioxusLabs dependencies
takia = { workspace = true }

# Linebender + WGPU dependencies
parley = { workspace = true, features = ["bytemuck"] }
skrifa = { workspace = true }
color = { workspace = true }
peniko = { workspace = true }
kurbo = { workspace = true }
usvg = { workspace = true, optional = true }

# Other dependencies
bytemuck = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
anyrender_vello_cpu = { workspace = true }
apace-dom = { workspace = true, features = ["system-fonts", "complex-scripts"] }
