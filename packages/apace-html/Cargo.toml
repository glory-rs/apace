[package]
name = "apace-html"
description = "Apace HTML parser"
documentation = "https://docs.rs/apace-html"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
accessibility = ["apace-dom/accessibility"]
tracing = ["dep:tracing", "apace-dom/tracing"]

[dependencies]
# Apace dependencies
apace-dom = { workspace = true }
apace-traits = { workspace = true }

# Servo dependencies
html5ever = { workspace = true }
xml5ever = { workspace = true }

tracing = { workspace = true, optional = true }
