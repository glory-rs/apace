[package]
name = "apace_accesskit"
version = "0.2.2"
license = "Apache-2.0"
description = "AccessKit UI accessibility infrastructure: cross-platform adapter"
keywords = ["gui", "ui", "accessibility"]
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["accesskit_unix", "async-io"]
async-io = ["accesskit_unix/async-io"]
tokio = ["accesskit_unix/tokio"]

[dependencies]
accesskit = { version = "0.25.2" }
raw-window-handle = { version = "0.6.2", features = ["std"] }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = { version = "0.35.2" }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { version = "0.27.2" }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
accesskit_unix = { version = "0.24.1", optional = true, default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
accesskit_android = { version = "0.9.1", optional = true, features = ["embedded-dex"] }
android-activity = { version = "0.6.1" }

[dev-dependencies]
wingy-core = { version = "=0.31.1", path = "../../../wingy/wingy-core" }
raw-window-handle = { version = "0.6.2"}
