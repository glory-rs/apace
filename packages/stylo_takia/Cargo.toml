[package]
name = "stylo_takia"
license = "MIT OR Apache-2.0 OR MPL-2.0"
description = "Interop crate for the stylo and takia crates"
keywords = ["css", "layout"]
version.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true


[dependencies]
bitflags = { workspace = true }
takia = { workspace = true }
style = { workspace = true }
style_atoms = { workspace = true }

[features]
default = ["std", "block", "flexbox", "grid"]
std = ["takia/std"]
block = ["takia/block_layout"]
flexbox = ["takia/flexbox", "takia/flexbox_balance"]
grid = ["takia/grid"]
floats = ["takia/float_layout"]
# Frame-aware style getters for CSS vertical writing modes (transposes physical styles into Takia's
# inline/block axes). Off by default: every getter is the plain physical mapping.
writing-mode = []
