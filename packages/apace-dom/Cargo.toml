[package]
name = "apace-dom"
description = "Apace DOM implementation"
documentation = "https://docs.rs/apace-dom"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = [
    "svg",
    "woff",
    "accessibility",
    "system-fonts",
    "file-input",
    "custom-widget",
    "text-transform-icu"
]
custom-widget = ["dep:anyrender", "accessibility"]
tracing = ["dep:tracing"]
svg = ["dep:usvg", "dep:svgtypes"]
# WOFF decoding (using the "wuff" crate which is pure Rust)
woff = ["dep:wuff"]
accessibility = ["accesskit"]
system-fonts = ["parley/system"]
# complex-scripts: enable dictionary-based line-breaking
complex-scripts = ["parley/complex-scripts"]
# text-transform-icu: language-aware, Unicode-complete case mapping for `text-transform`
# (otherwise falls back to the standard library's case mapping)
text-transform-icu = ["dep:icu_casemap", "dep:writeable"]
autofocus = []
floats = ["takia/float_layout", "stylo_takia/floats"]
# CSS vertical `writing-mode` support (layout runs in each box's writing-mode frame; see layout/writing_mode.rs)
writing-mode = ["stylo_takia/writing-mode"]
file-input = []
# Overlay-scrollbar thumb interaction (drag + hover tracking). Normally
# enabled through `apace-paint/scrollbars`, which paints the thumbs.
scrollbars = []
parallel-construct = []
log-phase-times = ["apace_debug_timer/enable"]

[dependencies]
# Apace dependencies
apace-traits = { workspace = true }
stylo_takia = { workspace = true, features = ["default"] }
apace_debug_timer = { workspace = true }

# Servo dependencies
style = { workspace = true }
selectors = { workspace = true }
cssparser = { workspace = true }
style_config = { workspace = true }
style_traits = { workspace = true }
style_dom = { workspace = true }
app_units = { workspace = true }
euclid = { workspace = true }
atomic_refcell = { workspace = true }
markup5ever = { workspace = true }
smallvec = { workspace = true }
thin-vec = { workspace = true }

# DioxusLabs dependencies
takia = { workspace = true }
anyrender = { workspace = true, optional = true }

# Linebender/Fontations dependencies
accesskit = { workspace = true, optional = true }
parley = { workspace = true }
skrifa = { workspace = true }
linebender_resource_handle = { workspace = true }
color = { workspace = true }
kurbo = { workspace = true }

# Unicode
icu_casemap = { workspace = true, optional = true }
icu_locale_core = { workspace = true }
icu_properties = { workspace = true }
icu_segmenter = { workspace = true }
writeable = { workspace = true, optional = true }

# Other dependencies
slotmap = { workspace = true }
bitflags = { workspace = true }
tracing = { workspace = true, optional = true }
rayon = { workspace = true }

# Media & Decoding
image = { workspace = true }
usvg = { workspace = true, optional = true }
svgtypes = { workspace = true, optional = true }
wuff = { workspace = true, optional = true }
html-escape = { workspace = true }
percent-encoding = { workspace = true }

# IO & Networking
url = { workspace = true }

# Input
keyboard-types = { workspace = true }
cursor-icon = { workspace = true }
thread_local = { workspace = true }

# WASM
web-time = { workspace = true }

# HACK: Apace doesn't need to depend on objc2 directly. But this feature flag is necessary
# to prevent debug builds from panicking.
[target.'cfg(any(target_vendor = "apple"))'.dependencies]
objc2 = { version = "0.6", features = ["disable-encoding-assertions"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dev-dependencies]
# Keep standalone engine tests on the same runtime-loaded Fontconfig path as
# Glory's adapter, without depending on host development headers/pkg-config.
fontique = { version = "=0.12.0", default-features = false, features = ["fontconfig-dlopen"] }
