[package]
publish = false
name = "dioxus-native-dom"
version = "0.7.0"
authors = ["Jonathan Kelley", "Nico Burns"]
edition = "2024"
description = "Core headless native renderer for Dioxus based on apace"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DioxusLabs/dioxus/"
homepage = "https://dioxuslabs.com/learn/0.7/getting_started"
keywords = ["dom", "ui", "gui", "react"]

[features]
default = ["accessibility", "svg", "system-fonts", "text-transform-icu"]

# DOM features
svg = ["apace-dom/svg"]
floats = ["apace-dom/floats"]
accessibility = ["apace-dom/accessibility"]
tracing = ["dep:tracing", "apace-dom/tracing"]
system-fonts = ["apace-dom/system-fonts"]
# complex-scripts: enable dictionary-based line-breaking
complex-scripts = ["apace-dom/complex-scripts"]
autofocus = ["apace-dom/autofocus"]
text-transform-icu = ["apace-dom/text-transform-icu"]
writing-mode = ["apace-dom/writing-mode"]

[dependencies]
# Apace dependencies
apace-dom = { workspace = true, default-features = false, features = ["custom-widget"] }
apace-traits = { workspace = true }

# DioxusLabs dependencies
dioxus-core = { workspace = true }
dioxus-html = { workspace = true }

# Windowing & Input
keyboard-types = { workspace = true }


# Other dependencies
tracing = { workspace = true, optional = true }
rustc-hash = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
dioxus = { workspace = true }

[package.metadata.docs.rs]
all-features = true
