[package]
name = "apace-shell"
description = "Apace application shell"
documentation = "https://docs.rs/apace-shell"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["accessibility", "clipboard", "file-dialog"]
accessibility = [
    "dep:accesskit",
    "dep:apace_accesskit",
    "apace-dom/accessibility",
]
clipboard = ["dep:arboard"]
tracing = ["dep:tracing", "apace-dom/tracing"]
file-dialog = ["dep:rfd"]
# Enables a data-uri-only NetProvider. Only needed if you aren't using the regular NetProvider
data-uri = ["dep:data-url"]
custom-widget = ["apace-dom/custom-widget"]
android-game-activity = ["wingy/android-game-activity"]

[dependencies]
# Apace dependencies
apace-traits = { workspace = true }
apace-dom = { workspace = true }
apace-paint = { workspace = true }
anyrender = { workspace = true }

# Windowing & Input
wingy = { workspace = true }
keyboard-types = { workspace = true }
accesskit = { workspace = true, optional = true }
apace_accesskit = { workspace = true, optional = true }

# Other dependencies
atomic_refcell = { workspace = true }
tracing = { workspace = true, optional = true }
futures-util = { workspace = true }
data-url = { workspace = true, optional = true }

# WASM
web-time = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["HtmlCanvasElement", "Window"] }
wasm-bindgen = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1" }

[target.'cfg(any(target_os = "windows",target_os = "macos",target_os = "linux",target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
rfd = { workspace = true, optional = true, features = ["xdg-portal"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[target.'cfg(any(target_os = "windows",target_os = "macos",target_os = "linux",target_os = "dragonfly",target_os = "freebsd",target_os = "netbsd",target_os = "openbsd"))'.dependencies]
arboard = { workspace = true, optional = true }
