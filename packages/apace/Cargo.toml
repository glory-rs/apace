[package]
name = "apace"
description = "High-level APIs for rendering HTML with Apace"
documentation = "https://docs.rs/apace"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["net", "accessibility", "text-transform-icu", "tracing"]
net = ["dep:tokio", "dep:url", "dep:apace-net"]
accessibility = ["apace-shell/accessibility"]
text-transform-icu = ["apace-dom/text-transform-icu"]
tracing = ["dep:tracing", "apace-shell/tracing", "apace-html/tracing", "apace-net/tracing"]
scrollbars = ["apace-paint/scrollbars"]
writing-mode = ["apace-dom/writing-mode"]

[dependencies]
# Apace dependencies
anyrender_vello = { workspace = true }
apace-traits = { workspace = true }
apace-dom = { workspace = true }
apace-html = { workspace = true }
apace-shell = { workspace = true }
apace-paint = { workspace = true }
apace-net = { workspace = true, optional = true }

# IO & Networking
url = { workspace = true, features = ["serde"], optional = true }
tokio = { workspace = true, features = ["rt"], optional = true }

tracing = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
