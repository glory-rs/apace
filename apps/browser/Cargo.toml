[package]
name = "browser"
version = "0.0.0"
edition = "2024"
license.workspace = true
publish = false

rust-version = "1.95"

[[bin]]
name = "apace"
path = "src/main.rs"

[features]
default = ["hybrid", "cookies", "cache", "screenshot", "apple-font-embolden", "scrollbars", "mimalloc"]
android-defaults = ["skia", "cookies"]

screenshot = ["dep:anyrender_vello_cpu", "dep:apace-paint", "dep:png", "dep:peniko", "dep:rfd"]
capture = ["dep:anyrender_serialize", "dep:apace-paint", "dep:png", "dep:peniko", "dep:rfd"]
vello = ["dioxus-native/vello"]
hybrid = ["dioxus-native/vello-hybrid"]
skia = ["dioxus-native/skia"]
skia-raster = ["skia-raster-pixels"]
skia-raster-pixels = ["dioxus-native/skia-pixels"]
skia-raster-softbuffer = ["dioxus-native/skia-softbuffer"]
cpu = ["cpu-pixels"]
cpu-pixels = ["dioxus-native/vello-cpu-pixels"]
cpu-softbuffer = ["dioxus-native/vello-cpu-softbuffer"]
log-times = ["log-frame-times", "log-phase-times"]
log-frame-times = ["dioxus-native/log-frame-times"]
log-phase-times = ["dioxus-native/log-phase-times"]
cache = ["apace-net/cache"]
cookies = ["apace-net/cookies"]
avif = ["image/avif"]
webp = ["image/webp"]
# Enable JavaScript execution for loaded pages (via apace-vibey-script's Boa-based engine)
javascript = ["dep:apace-vibey-script"]
tracing = ["dioxus-native/tracing", "apace-html/tracing", "apace-net/tracing", "apace-paint?/tracing", "dep:tracing-subscriber"]
hot-reload = ["dioxus-native/hot-reload"]
accessibility = ["dioxus-native/accessibility"]
scrollbars = ["apace-dom/scrollbars", "apace-paint/scrollbars"]
mimalloc = ["dep:mimalloc"]
font-embolden = ["dioxus-native/font-embolden"]
apple-font-embolden = ["dioxus-native/apple-font-embolden"]
writing-mode = ["apace-dom/writing-mode", "dioxus-native/writing-mode"]

[dependencies]
dioxus-native = { workspace = true, features = [
  "svg",
  "system-fonts",
  "net",
  "prelude",
  "hot-reload"
] }
apace-traits = { workspace = true }
apace-dom = { workspace = true, features = ["woff", "parallel-construct", "floats", "text-transform-icu"] }
apace-net = { workspace = true, features = ["http2"] }
apace-html = { workspace = true }
apace-vibey-script = { workspace = true, optional = true }
browser-persistence = { workspace = true }
linebender_resource_handle = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
webbrowser = { workspace = true }
wingy = { workspace = true }
image = { workspace = true, features = ["ico"] }
usvg = { workspace = true }
nucleo = "0.5.0"
anyrender = { workspace = true }
anyrender_serialize = { workspace = true, optional = true }
anyrender_vello_cpu = { workspace = true, optional = true }
apace-paint = { workspace = true, optional = true }
png = { workspace = true, optional = true }
peniko = { workspace = true, optional = true }

tokio = { workspace = true, features = ["time", "rt", "sync", "macros"] }

# Allocators
mimalloc = { version = "0.1.52", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = { workspace = true, features = ["xdg-portal"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
