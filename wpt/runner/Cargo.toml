[package]
name = "wpt"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["cpu"]
gpu = ["dep:anyrender_vello"]
cpu = ["dep:anyrender_vello_cpu"]

[dependencies]
mimalloc = "0.1.52"
apace-dom = { workspace = true, features = ["svg", "floats", "system-fonts", "woff", "complex-scripts", "text-transform-icu", "writing-mode"] }
apace-html = {workspace = true }
apace-vibey-script = { workspace = true }
apace-traits = { workspace = true }
apace-paint = { workspace = true, features = ["default"] }
anyrender = { workspace = true }
anyrender_vello = { workspace = true, optional = true }
anyrender_vello_cpu = { workspace = true, optional = true }

takia = { workspace = true }
style = { workspace = true }
style_traits = { workspace = true }
markup5ever = { workspace = true }
html5ever = { workspace = true }
roxmltree = "0.21.2"
parley = { workspace = true }
peniko = { workspace = true }
image = { workspace = true, features = ["png"] }
url = { workspace = true }
data-url = { workspace = true }
png = { version = "0.18.1" }
glob = { version = "0.3.4" }
html-escape = { workspace = true }
dify = { version = "0.8.0", default-features = false }
env_logger = { version = "0.11.11" }
owo-colors = "4.4.0"
log = "0.4.34"
regex = "1.13.1"
rayon = { workspace = true }
thread_local = { workspace = true }
bitflags = "2.13.2"
pollster = "1.0.1"
atomic_float = "1.1.0"
supports-hyperlinks = "3.2.0"
terminal-link = "0.1.0"
wptreport = { version = "0.1.1", default-features = false }
os_info = "3.15.0"
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
