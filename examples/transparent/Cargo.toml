[package]
name = "transparent"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

rust-version = "1.95"

[features]
default = ["hybrid"]
system-fonts = ["apace-dom/system-fonts"]
vello = ["dioxus-native/vello"]
cpu = ["cpu-pixels"]
svg = ["apace-paint/svg"]
hybrid = ["dioxus-native/vello-hybrid"]
cpu-pixels = ["dioxus-native/vello-cpu-pixels"]
cpu-softbuffer = ["dioxus-native/vello-cpu-softbuffer"]
skia = ["dioxus-native/skia"]

[dependencies]
dioxus-native = { workspace = true, default-features = false, features = ["prelude", "system-fonts"] }

# Control whether system font support is enabled
apace-dom = { workspace = true, default-features = false }
apace-paint = { workspace = true, default-features = false }
apace-traits = { workspace = true }

# Disable unicode URL support
# See https://github.com/hsivonen/idna_adapter
idna_adapter = "=1.2.2"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
